name: Validate message timestamps batch

on:
  push:
    branches:
      - agent/message-timestamps

permissions:
  contents: write

concurrency:
  group: message-timestamps-batch
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[timestamps-result]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/message-timestamps

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply and validate batch
        shell: bash
        run: |
          set +e
          rm -f /tmp/timestamps.log
          run_check() {
            echo "## $*" | tee -a /tmp/timestamps.log
            "$@" >>/tmp/timestamps.log 2>&1
            code=$?
            echo "exit=$code" | tee -a /tmp/timestamps.log
            return $code
          }

          status=0
          run_check python scripts/apply_message_timestamps.py || status=$?
          if [ "$status" -eq 0 ]; then run_check cargo run -p torchat-contract-gen || status=$?; fi
          if [ "$status" -eq 0 ]; then run_check cargo fmt --all -- --check || status=$?; fi
          if [ "$status" -eq 0 ]; then run_check cargo test -p torchat-client-runtime || status=$?; fi
          if [ "$status" -eq 0 ]; then run_check cargo test -p torchat-client-engine || status=$?; fi
          if [ "$status" -eq 0 ]; then run_check cargo test -p torchat-client-engine-ffi || status=$?; fi
          if [ "$status" -eq 0 ]; then run_check bash -lc 'cd mobile && flutter pub get' || status=$?; fi
          if [ "$status" -eq 0 ]; then run_check bash -lc 'cd mobile && dart format --output=none --set-exit-if-changed lib test' || status=$?; fi
          if [ "$status" -eq 0 ]; then run_check bash -lc 'cd mobile && flutter analyze' || status=$?; fi
          if [ "$status" -eq 0 ]; then run_check bash -lc 'cd mobile/android && ./gradlew :app:compileDebugKotlin --stacktrace' || status=$?; fi

          git config user.name "torchat-release-bot"
          git config user.email "torchat-release-bot@users.noreply.github.com"

          if [ "$status" -eq 0 ]; then
            rm -f scripts/apply_message_timestamps.py .github/workflows/validate-message-timestamps.yml MESSAGE_TIMESTAMP_VALIDATION.md
            git add -A
            git commit -m "[timestamps-result] Persist message state timestamps"
            git push origin HEAD:agent/message-timestamps
            exit 0
          fi

          git reset --hard HEAD
          {
            echo '# Message timestamp validation failed'
            echo
            echo "Exit code: $status"
            echo
            echo '```text'
            tail -n 400 /tmp/timestamps.log
            echo '```'
          } > MESSAGE_TIMESTAMP_VALIDATION.md
          git add MESSAGE_TIMESTAMP_VALIDATION.md
          git commit -m "[timestamps-result] Record message timestamp validation failure"
          git push origin HEAD:agent/message-timestamps
          exit "$status"
