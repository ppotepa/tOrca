name: Complete TorChat 0.1

on:
  push:
    branches:
      - agent/complete-release-0-1

permissions:
  contents: write

concurrency:
  group: complete-torchat-0-1
  cancel-in-progress: false

jobs:
  pagination-and-scroll:
    if: ${{ !contains(github.event.head_commit.message, '[agent-0.1]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/complete-release-0-1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Apply release 0.1 patch
        run: |
          sed -i "s/saved.clamp(0.0, _scroll.position.maxScrollExtent);/saved.clamp(0.0, _scroll.position.maxScrollExtent).toDouble();/" scripts/apply_release_0_1.py
          python scripts/apply_release_0_1.py

      - name: Format Dart
        working-directory: mobile
        run: dart format lib test integration_test

      - name: Analyze Flutter
        working-directory: mobile
        run: flutter analyze

      - name: Compile Android Kotlin
        working-directory: mobile/android
        run: ./gradlew :app:compileDebugKotlin --stacktrace

      - name: Verify generated contract is clean
        run: git diff --check

      - name: Commit validated implementation
        run: |
          git config user.name "torchat-release-bot"
          git config user.email "torchat-release-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "[agent-0.1] Implement message pagination and scroll restoration"
          git push origin HEAD:agent/complete-release-0-1
