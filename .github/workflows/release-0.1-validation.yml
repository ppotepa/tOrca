name: TorChat 0.1 validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: release-0.1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust runtime and engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check runtime
        run: cargo check -p torchat-client-runtime
      - name: Test runtime
        run: cargo test -p torchat-client-runtime
      - name: Check engine
        run: cargo check -p torchat-client-engine
      - name: Test engine
        run: cargo test -p torchat-client-engine
      - name: Clippy
        run: cargo clippy -p torchat-client-runtime -p torchat-client-engine --all-targets -- -D warnings

  flutter:
    name: Flutter analyze and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencies
        run: flutter pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build Android debug
        run: flutter build apk --debug

  windows:
    name: Windows debug build
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: Dependencies
        run: flutter pub get
      - name: Build Windows debug
        run: flutter build windows --debug
