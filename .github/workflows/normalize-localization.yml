name: Normalize localization catalogs

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ !contains(github.event.head_commit.message, '[skip localization normalization]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Remove duplicate top-level ARB keys through GitHub API
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const paths = [
              'apps/mobile/flutter/lib/locales/resources/app_en.arb',
              'apps/mobile/flutter/lib/locales/resources/app_pl.arb',
            ];

            function normalize(text) {
              const seen = new Set();
              const output = [];
              let changed = false;
              for (const line of text.split(/\r?\n/)) {
                const match = line.match(/^\s{2}"([^"]+)"\s*:/);
                if (match) {
                  const key = match[1];
                  if (seen.has(key)) {
                    changed = true;
                    continue;
                  }
                  seen.add(key);
                }
                output.push(line);
              }
              return { changed, content: `${output.join('\n').replace(/\n*$/, '')}\n` };
            }

            for (const path of paths) {
              const current = await github.rest.repos.getContent({
                owner,
                repo,
                path,
                ref: 'main',
              });
              if (Array.isArray(current.data) || current.data.type !== 'file') {
                throw new Error(`Expected file at ${path}`);
              }
              const source = Buffer.from(current.data.content, 'base64').toString('utf8');
              const normalized = normalize(source);
              if (!normalized.changed) {
                core.info(`${path}: no duplicate top-level keys`);
                continue;
              }
              await github.rest.repos.createOrUpdateFileContents({
                owner,
                repo,
                path,
                branch: 'main',
                sha: current.data.sha,
                message: `Normalize ${path} [skip localization normalization]`,
                content: Buffer.from(normalized.content, 'utf8').toString('base64'),
              });
              core.info(`${path}: duplicate top-level keys removed`);
            }
