name: nightly resilience

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz-and-resilience:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Select pinned Rust toolchain
        run: |
          rustup toolchain install 1.94.1 --profile minimal
          rustup default 1.94.1
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked --version 0.12.0
      - name: Run bounded fuzz targets
        shell: bash
        run: |
          set -euo pipefail
          for target in application_payload peer_frame relay_payload mls_snapshot; do
            cargo fuzz run "$target" --manifest-path fuzz/Cargo.toml -- -max_total_time=20 -runs=0
          done
      - name: Runtime resilience tests
        run: cargo test -p torchat-runtime --quiet

  real-tor:
    if: ${{ vars.TORCHAT_NIGHTLY_REAL_TOR == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Real-Tor resilience environment
        run: |
          echo "Real-Tor nightly is enabled by repository variable."
          echo "Deployment-specific bootstrap belongs to the protected environment."
