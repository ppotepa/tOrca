name: P2P transport validation

# This workflow is intentionally narrow so transport regressions fail quickly.
on:
  push:
    branches: [main]
    paths:
      - "common/torchat-client-engine/src/peer/**"
      - "common/torchat-client-engine/Cargo.toml"
      - "common/torchat-core/src/peer_protocol.rs"
      - "mobile/lib/core/runtime/runtime_repository.dart"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/p2p-transport.yml"
  pull_request:
    paths:
      - "common/torchat-client-engine/src/peer/**"
      - "common/torchat-client-engine/Cargo.toml"
      - "common/torchat-core/src/peer_protocol.rs"
      - "mobile/lib/core/runtime/runtime_repository.dart"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/p2p-transport.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust peer transport
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --depth 1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
      - name: Select repository Rust toolchain
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          rustup default 1.94.0
      - name: Check client engine
        run: cargo check --locked -p torchat-client-engine
      - name: Test peer scheduler
        run: cargo test --locked -p torchat-client-engine peer::queue
