name: Single baseline cleanup

on:
  push:
    branches:
      - cleanup/single-baseline
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/single-baseline
          fetch-depth: 0

      - name: Apply baseline cleanup
        shell: python
        run: |
          from pathlib import Path
          import re

          def remove_rust_item(text: str, signature: str) -> str:
              start = text.find(signature)
              if start < 0:
                  return text
              brace = text.find('{', start)
              if brace < 0:
                  raise RuntimeError(f'opening brace missing for {signature}')
              depth = 0
              i = brace
              while i < len(text):
                  if text[i] == '{':
                      depth += 1
                  elif text[i] == '}':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          while end < len(text) and text[end] in ' \t':
                              end += 1
                          if end < len(text) and text[end] == '\n':
                              end += 1
                          return text[:start] + text[end:]
                  i += 1
              raise RuntimeError(f'closing brace missing for {signature}')

          actor_dir = Path('packages/torchat-client-engine/src/actor')
          legacy = actor_dir / 'legacy.rs'
          state = actor_dir / 'state.rs'
          if legacy.exists():
              text = legacy.read_text()
              text = remove_rust_item(text, '    pub async fn run(\n')
              state.write_text(text)
              legacy.unlink()

          mod_file = actor_dir / 'mod.rs'
          mod_text = mod_file.read_text().replace('include!("legacy.rs");', 'include!("state.rs");')
          mod_file.write_text(mod_text)

          runtime = Path('packages/torchat-runtime/src/runtime.rs')
          runtime_text = runtime.read_text()
          runtime_text = re.sub(
              r'\n    /// Compatibility helper for non-engine hosts\.[\s\S]*?\n    pub fn set_nickname\([\s\S]*?\n    }\n',
              '\n',
              runtime_text,
              count=1,
          )
          runtime.write_text(runtime_text)

          relay_mod = Path('packages/torchat-client-engine/src/relay/mod.rs')
          relay_text = relay_mod.read_text()
          relay_text = re.sub(
              r'\n    fn submit_pairing_code\(&mut self, code: &str\) -> RuntimeResult<PairingItem>;\n',
              '\n',
              relay_text,
              count=1,
          )
          relay_mod.write_text(relay_text)

          relay_actor = Path('packages/torchat-client-engine/src/relay/actor.rs')
          relay_actor_text = relay_actor.read_text()
          relay_actor_text = remove_rust_item(relay_actor_text, '    fn submit_pairing_code(&mut self, _code: &str) -> RuntimeResult<PairingItem> {')
          if 'Self::removed()' not in relay_actor_text:
              relay_actor_text = remove_rust_item(relay_actor_text, '    fn removed<T>() -> RuntimeResult<T> {')
          relay_actor.write_text(relay_actor_text)

          engine = Path('packages/torchat-client-engine/src/engine.rs')
          engine_text = engine.read_text().replace(
              'pub const COMMAND_CHANNEL_CAPACITY: usize = ENGINE_INBOX_CAPACITY;\n',
              '',
          )
          engine.write_text(engine_text)

          source_size = Path('scripts/internal/check-source-size.ps1')
          if source_size.exists():
              source_text = source_size.read_text()
              source_text = source_text.replace(
                  "    'packages/torchat-client-engine/src/actor/legacy.rs',\n",
                  '',
              )
              source_text = source_text.replace(
                  'packages/torchat-client-engine/src/actor/legacy.rs',
                  'packages/torchat-client-engine/src/actor/state.rs',
              )
              source_size.write_text(source_text)

      - name: Format
        run: cargo fmt --all

      - name: Check client engine
        run: cargo check -p torchat-client-engine

      - name: Check runtime
        run: cargo check -p torchat-runtime

      - name: Commit batch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "cleanup: remove legacy actor and compatibility paths"
          git push origin HEAD:cleanup/single-baseline
