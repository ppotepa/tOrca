name: Localization audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Validate ARB and presentation copy through GitHub API
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            async function readFile(path) {
              const response = await github.rest.repos.getContent({
                owner,
                repo,
                path,
                ref: context.sha,
              });
              if (Array.isArray(response.data) || response.data.type !== 'file') {
                throw new Error(`Expected file: ${path}`);
              }
              return Buffer.from(response.data.content, 'base64').toString('utf8');
            }

            function messageKeys(catalog) {
              return Object.keys(catalog)
                .filter((key) => !key.startsWith('@'))
                .sort();
            }

            function placeholders(catalog, key) {
              const metadata = catalog[`@${key}`] || {};
              return Object.keys(metadata.placeholders || {}).sort();
            }

            const en = JSON.parse(await readFile('apps/mobile/flutter/lib/locales/resources/app_en.arb'));
            const pl = JSON.parse(await readFile('apps/mobile/flutter/lib/locales/resources/app_pl.arb'));
            if (en['@@locale'] !== 'en' || pl['@@locale'] !== 'pl') {
              throw new Error('ARB locale declarations are invalid');
            }

            const enKeys = messageKeys(en);
            const plKeys = messageKeys(pl);
            if (JSON.stringify(enKeys) !== JSON.stringify(plKeys)) {
              const missingPl = enKeys.filter((key) => !plKeys.includes(key));
              const extraPl = plKeys.filter((key) => !enKeys.includes(key));
              throw new Error(
                `ARB key mismatch; missing in pl=${missingPl.join(',')}; extra in pl=${extraPl.join(',')}`,
              );
            }
            for (const key of enKeys) {
              const expected = placeholders(en, key);
              const actual = placeholders(pl, key);
              if (JSON.stringify(expected) !== JSON.stringify(actual)) {
                throw new Error(
                  `Placeholder mismatch for ${key}: en=${expected.join(',')} pl=${actual.join(',')}`,
                );
              }
            }

            const tree = await github.rest.git.getTree({
              owner,
              repo,
              tree_sha: context.sha,
              recursive: 'true',
            });
            const sourcePaths = tree.data.tree
              .filter((entry) => entry.type === 'blob')
              .map((entry) => entry.path)
              .filter((path) =>
                (path === 'apps/mobile/flutter/lib/main.dart' ||
                  path.startsWith('apps/mobile/flutter/lib/features/') ||
                  path.startsWith('apps/mobile/flutter/lib/shared/widgets/') ||
                  path.startsWith('apps/mobile/flutter/lib/locales/presentation/') ||
                  path.startsWith('apps/mobile/flutter/lib/locales/application/') ||
                  path.startsWith('apps/mobile/flutter/android/app/src/main/kotlin/')) &&
                (path.endsWith('.dart') || path.endsWith('.kt')),
              );

            const forbidden = [
              ['LocalizedUiCopy', 'obsolete localization proxy'],
              ['localized_ui_copy.dart', 'obsolete localization proxy import'],
              ["localeName.toLowerCase().startsWith('pl')", 'manual locale branching'],
              ['lookupAppLocalizations(const Locale(\'pl\'))', 'hard-coded Polish fallback'],
            ];
            const polish = /(?:Nie udało|Zaproszenie|Oczekujące|Zakończono|Ustawienia|Kontakty|Czaty|Pokaż|Ukryj|Zapisz|Anuluj|Spróbuj|Łączenie|Uruchamianie|Gotowy|Brak kontaktów)/i;
            const rawException = /(?:show(?:Error|Warning|Info|Success)|Text|StatusBanner|InlineStatus)[^\n]*error\.toString\(/;
            const assignedRawException = /_error\s*=\s*error\.toString\(/;
            const enumAsLabel = /(?:Text|subtitle|title|label|tooltip|semanticLabel)\s*[:(][^\n]*\.name\b/;
            const violations = [];

            for (const path of sourcePaths) {
              const entry = tree.data.tree.find((item) => item.path === path);
              const blob = await github.rest.git.getBlob({
                owner,
                repo,
                file_sha: entry.sha,
              });
              const text = Buffer.from(blob.data.content, 'base64').toString('utf8');
              const lines = text.split(/\r?\n/);
              lines.forEach((line, index) => {
                const trimmed = line.trimStart();
                if (trimmed.startsWith('//')) return;
                for (const [needle, reason] of forbidden) {
                  if (line.includes(needle)) {
                    violations.push(`${path}:${index + 1}: ${reason}: ${line.trim()}`);
                  }
                }
                if (path.endsWith('.dart') && polish.test(line)) {
                  violations.push(`${path}:${index + 1}: Polish copy outside ARB: ${line.trim()}`);
                }
                if (rawException.test(line) || assignedRawException.test(line)) {
                  violations.push(`${path}:${index + 1}: raw exception displayed: ${line.trim()}`);
                }
                if (enumAsLabel.test(line)) {
                  violations.push(`${path}:${index + 1}: enum name used as copy: ${line.trim()}`);
                }
              });
            }

            if (violations.length > 0) {
              core.setFailed(`Localization audit found ${violations.length} issue(s):\n${violations.join('\n')}`);
              return;
            }
            core.info(`Localization audit passed: ${enKeys.length} messages, ${sourcePaths.length} presentation files.`);
