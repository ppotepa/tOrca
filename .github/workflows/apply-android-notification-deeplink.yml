name: Apply Android notification deep link

on:
  push:
    branches:
      - agent/complete-release-0-1

permissions:
  contents: write

concurrency:
  group: android-notification-deep-link
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[android-notification]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/complete-release-0-1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Apply adapter patch
        run: python scripts/apply_android_notification_deeplink.py

      - name: Format and analyze Flutter
        working-directory: mobile
        run: |
          dart format lib
          flutter analyze

      - name: Compile Android Kotlin
        working-directory: mobile/android
        run: ./gradlew :app:compileDebugKotlin --stacktrace

      - name: Validate patch
        run: git diff --check

      - name: Commit validated Android notification flow
        run: |
          git config user.name "torchat-release-bot"
          git config user.email "torchat-release-bot@users.noreply.github.com"
          git add -A
          git commit -m "[android-notification] Complete Android notification deep links"
          git push origin HEAD:agent/complete-release-0-1
