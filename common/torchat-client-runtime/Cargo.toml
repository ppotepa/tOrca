[package]
name = "torchat-client-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared TorChat client runtime contract and DTOs"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
torchat-core = { path = "../torchat-core" }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
pretty_assertions = "1"
