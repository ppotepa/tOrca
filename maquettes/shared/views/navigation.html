<template id="tpl-dock">
  <nav class="dock">
    <button class="{{chatsClass}}" data-action="tab" data-tab="chats">{{chatsIcon}}<span>{{chatsLabel}}</span></button>
    <button class="{{contactsClass}}" data-action="tab" data-tab="contacts">{{contactsIcon}}<span>{{contactsLabel}}</span></button>
    <button class="{{inboxClass}}" data-action="tab" data-tab="inbox">{{inboxIcon}}<span>{{inboxLabel}}</span>{{inboxBadge}}</button>
  </nav>
</template>
<template id="tpl-rail">
  <aside class="rail">
    <div class="rail-brand">
      <div class="brand-mark">{{torIcon}}</div>
      <div class="brand-copy">
        <strong>TorChat</strong>
        <span>desktop client</span>
      </div>
    </div>
    <nav class="rail-nav">
      <button class="{{chatsClass}}" data-action="tab" data-tab="chats">{{chatsIcon}}<span>Czaty</span></button>
      <button class="{{contactsClass}}" data-action="tab" data-tab="contacts">{{contactsIcon}}<span>Kontakty</span></button>
      <button class="{{inboxClass}}" data-action="tab" data-tab="inbox">{{inboxIcon}}<span>Inbox</span>{{inboxBadge}}</button>
    </nav>
    <div class="rail-footer">
      <button class="rail-identity" data-action="open-account">
        <span class="rail-avatar">{{initial}}</span>
        <span class="rail-identity-copy"><strong>{{nickname}}</strong><small>Lokalny profil</small></span>
      </button>
      <button class="rail-settings" data-action="open-settings" title="Ustawienia" aria-label="Ustawienia">{{settingsIcon}}<span>Ustawienia</span></button>
    </div>
  </aside>
</template>
<template id="tpl-desktop-status">
  <div class="desktop-status {{torClass}}" data-action="open-tor" title="{{torLabel}}">
    <span class="desktop-status-line"></span>
    <span class="desktop-status-copy"><strong>{{torLabel}}</strong><small>Komunikacja przez onion</small></span>
    <span class="desktop-status-badge">{{latency}}</span>
  </div>
</template>
<template id="tpl-list-shell">
  <div class="list-shell">
    <header class="list-header">
      <div class="list-copy">
        <div class="eyebrow">{{eyebrow}}</div>
        <h1>{{title}}</h1>
        <p>{{subtitle}}</p>
      </div>
      <div class="header-actions">{{actions}}</div>
    </header>
    {{search}}
    <div class="list-body">{{items}}</div>
  </div>
</template>
