[package]
name = "torchat-relay-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Opaque rendezvous wire frames shared by TorChat clients and relay"

[dependencies]
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
serde_json = "1"
