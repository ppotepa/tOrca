[package]
name = "torchat-storage"
version.workspace = true
edition.workspace = true

[dependencies]
rusqlite.workspace = true
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
sha2 = "0.10"
url = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
torchat-core = { path = "../../common/torchat-core" }
torchat-domain = { path = "../torchat-domain" }
torchat-runtime = { path = "../torchat-runtime" }
