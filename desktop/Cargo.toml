[package]
name = "torchat-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "TorChat lightweight desktop client for Windows and Linux"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
futures-util = "=0.3.32"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
torchat-core = { path = "../common/torchat-core" }
torchat-client-engine = { path = "../common/torchat-client-engine" }
torchat-client-runtime = { path = "../common/torchat-client-runtime" }
