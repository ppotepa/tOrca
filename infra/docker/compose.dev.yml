services:
  server:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.server
    environment:
      TORCHAT_BIND: 0.0.0.0:8080
      TORCHAT_DATABASE_URL: postgres://torchat:${TORCHAT_DATABASE_PASSWORD:?TORCHAT_DATABASE_PASSWORD is required}@postgres:5432/torchat
      RUST_LOG: info
      TORCHAT_ONION_URL: ${TORCHAT_ONION_URL:-}
      TORCHAT_PAIRING_SECRET: ${TORCHAT_PAIRING_SECRET:?TORCHAT_PAIRING_SECRET is required}
      TORCHAT_DEV_RESERVED_PAIRING_NICKNAME: Torka
      TORCHAT_DEV_RESERVED_PAIRING_CODE: ${TORCHAT_TORKA_PAIRING_CODE:-42424242}
    ports:
      - "127.0.0.1:${TORCHAT_HTTP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: torchat
      POSTGRES_USER: torchat
      POSTGRES_PASSWORD: ${TORCHAT_DATABASE_PASSWORD:?TORCHAT_DATABASE_PASSWORD is required}
    volumes:
      - postgres_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U torchat -d torchat"]
      interval: 5s
      timeout: 5s
      retries: 10

  tor:
    build:
      context: .
      dockerfile: Dockerfile.tor
    depends_on:
      server:
        condition: service_started
    volumes:
      - tor_dev:/var/lib/tor
    ports:
      - "127.0.0.1:${TORCHAT_SOCKS_PORT:-9050}:9050"
    healthcheck:
      test: ["CMD-SHELL", "test -s /var/lib/tor/hidden_service/hostname"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Development-only independent client. It owns its own identity, Tor data
  # directory and onion service; it is never part of the relay server.
  torka:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.torka
    environment:
      TORCHAT_ONION_URL: ${TORCHAT_ONION_URL:-}
      TORCHAT_NICKNAME: Torka
      TORCHAT_TORKA_PAIRING_CODE: ${TORCHAT_TORKA_PAIRING_CODE:-42424242}
    depends_on:
      tor:
        condition: service_healthy
    volumes:
      - torka_dev:/var/lib/torchat
    restart: unless-stopped

volumes:
  postgres_dev:
  tor_dev:
  torka_dev:
