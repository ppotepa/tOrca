services:
  server:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.server
    environment:
      TORCHAT_BIND: 0.0.0.0:8080
    ports:
      - "127.0.0.1:${TORCHAT_HTTP_PORT:-8080}:8080"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: "none"
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev

  tor:
    build:
      context: .
      dockerfile: Dockerfile.tor
    depends_on:
      server:
        condition: service_started
    volumes:
      - tor_dev:/var/lib/tor
    ports:
      - "127.0.0.1:${TORCHAT_SOCKS_PORT:-9050}:9050"
    healthcheck:
      test: ["CMD-SHELL", "test -s /var/lib/tor/hidden_service/hostname"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Development-only independent client. It owns its own identity, Tor data
  # directory and onion service; it is never part of the relay server.
  torka:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.torka
    environment:
      TORCHAT_ONION_URL: ${TORCHAT_ONION_URL:-}
      TORCHAT_NICKNAME: Torka
    depends_on:
      tor:
        condition: service_healthy
    volumes:
      - torka_dev:/var/lib/torchat
    healthcheck:
      test: ["CMD-SHELL", "test -s /var/lib/torchat/torka-ready"]
      interval: 5s
      timeout: 3s
      retries: 72
    restart: unless-stopped

  # A finite, opt-in second engine.  It pairs with the persistent Torka peer,
  # waits for an authenticated direct onion session and proves normal message
  # delivery with ping -> pong.  It is deliberately behind a Compose profile:
  # routine developer deploys must never create or reset an extra client.
  torka-integration:
    profiles: ["integration"]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.torka
    entrypoint: ["python3", "/usr/local/bin/torka-integration"]
    environment:
      TORCHAT_ONION_URL: ${TORCHAT_ONION_URL:-}
      TORCHAT_INTEGRATION_TIMEOUT_SECONDS: ${TORCHAT_INTEGRATION_TIMEOUT_SECONDS:-240}
    depends_on:
      torka:
        condition: service_healthy
    volumes:
      - torka_integration_dev:/var/lib/torchat
    restart: "no"

volumes:
  tor_dev:
  torka_dev:
  torka_integration_dev:
