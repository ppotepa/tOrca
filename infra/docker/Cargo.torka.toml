[workspace]
resolver = "2"
members = [
    "common/torchat-core",
    "packages/torchat-runtime",
    "packages/torchat-client-engine",
    "apps/desktop/native",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
rusqlite = { version = "0.38", features = ["bundled-sqlcipher-vendored-openssl"] }
