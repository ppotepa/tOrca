services:
  server:
    deploy:
      replicas: 1
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.server
    environment:
      TORCHAT_BIND: 0.0.0.0:8080
    logging:
      driver: "none"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
  tor:
    build:
      context: .
      dockerfile: Dockerfile.tor
    depends_on:
      server:
        condition: service_started
    volumes:
      - type: bind
        source: ${TORCHAT_SECURE_ROOT:?TORCHAT_SECURE_ROOT is required}/onion
        target: /var/lib/tor
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "7"
    healthcheck:
      test: ["CMD-SHELL", "test -s /var/lib/tor/hidden_service/hostname"]
      interval: 5s
      timeout: 5s
      retries: 30
